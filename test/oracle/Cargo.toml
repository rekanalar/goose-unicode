[package]
name = "width-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
unicode-width = "0.2.2"
unicode-bidi = "0.3.18"
unicode-case-mapping = "1.0.0"

[[bin]]
name = "width"
path = "width.rs"

[[bin]]
name = "bidi"
path = "bidi.rs"

[[bin]]
name = "title"
path = "title.rs"

[profile.release]
opt-level = 2
